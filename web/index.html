<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关节模组上位机</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main class="layout">

  <!-- ============ 左：关节与实时读数 ============ -->
  <!-- ============ 顶栏：在线关节（通栏，横向排） ============ -->
  <section class="card card-rack">
    <div class="card-core">
    <h2 class="card-title card-title-inline">[ 在线关节 ]</h2>
    <ul id="slaveList" class="slave-list"></ul>
    <div class="spacer"></div>
    <!-- 总线状态 / 控制权 / 请求按钮：并到同一行，省掉一整条顶栏 -->
    <div id="busBadge" class="badge badge-idle">未连接</div>
    <div id="ownerBadge" class="badge badge-local">控制权：本机</div>
    <button id="btnTakeControl" class="btn btn-primary" disabled>请求控制权</button>
    <button id="btnReleaseControl" class="btn" hidden>交还控制权</button>
    </div>
  </section>

  <section class="card card-slaves">
    <div class="card-core">

    <!-- 关节标识：当前控制的是哪个关节、型号、额定力矩 -->
    <div class="module-badge">
      <div class="module-line1"><span id="moduleTitle">关节 --</span></div>
      <div class="module-line2" id="moduleModel">--</div>
    </div>

    <div class="readouts">
      <div class="readout">
        <label>位置</label>
        <div><span id="valPos" class="value">--</span><span class="unit">deg</span></div>
      </div>
      <div class="readout">
        <label>速度</label>
        <div><span id="valVel" class="value">--</span><span class="unit">deg/s</span></div>
      </div>
      <div class="readout">
        <label>力矩</label>
        <div><span id="valTor" class="value">--</span><span class="unit">N·m</span></div>
      </div>
    </div>

    <dl class="telemetry">
      <dt>驱动状态</dt><dd id="valState"><span id="dotState" class="dot"></span><span>--</span></dd>
      <dt>状态字</dt><dd id="valStatusWord" class="mono">--</dd>
      <dt>故障码</dt><dd id="valError" class="mono">--</dd>
      <dt>温度</dt><dd id="valTemp" class="mono">--</dd>
      <dt>刷新率</dt><dd id="valRate" class="mono">--</dd>
    </dl>
    </div>
  </section>

  <!-- ============ 中：操作（急停 / 使能 / 负载） ============ -->
  <section class="card card-operate">
    <div class="card-core">
    <h2 class="card-title">[ 操作 ]</h2>


    <button id="btnEstop" class="btn btn-estop">急停 ESTOP</button>

    <label class="toggle" for="chkReady">
      <input type="checkbox" id="chkReady">
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-text">已确认现场安全</span>
    </label>

    <div class="btn-row">
      <button id="btnEnable" class="btn btn-primary" disabled>使能</button>
      <button id="btnDisable" class="btn">失能</button>
      <button id="btnFaultReset" class="btn">故障复位</button>
    </div>
    <div class="btn-row">
      <button id="btnHome" class="btn">归零</button>
      <button id="btnZero" class="btn">回0</button>
    </div>

    <h3 class="section-title">负载（RS485 · 0-10V）</h3>
        <div class="load-row">
      <input type="range" id="loadSlider" min="0" max="100" value="0" step="1">
      <input type="number" id="loadValue" class="load-num" value="0" min="0" max="100" step="1">
      <span class="unit">N·m</span>
      <span class="load-volt" id="loadVolt">0.00 V</span>
      <button id="btnLoadSet" class="btn btn-primary">下发</button>
    </div>
    <div id="loadHint" class="hint"></div>

    </div>
  </section>



  <!-- ============ 右：目标下发 ============ -->
  <section class="card card-target">
    <div class="card-core">
    <h2 class="card-title">[ 目标 ]</h2>

    <div class="field">
      <label>操作模式</label>
      <select id="selMode">
        <option value="1">轮廓位置 PP</option>
        <option value="3">轮廓速度 PV</option>
        <option value="4">轮廓力矩 PT</option>
      </select>
    </div>
    <div class="field" data-mode="pos">
      <label>目标位置 (deg)</label><input type="number" id="inpPos" value="0" step="1">
    </div>
    <div class="field" data-mode="vel">
      <label>目标速度 (deg/s)</label><input type="number" id="inpVel" value="0" step="1">
    </div>
    <div class="field" data-mode="tor">
      <label>目标力矩 (N·m)</label><input type="number" id="inpTor" value="0" step="0.1">
    </div>
    <div class="field" data-mode="pos">
      <label>轮廓速度 (deg/s)</label><input type="number" id="inpProfVel" value="10" step="1">
    </div>
    <div class="field" data-mode="pos vel">
      <label>轮廓加速度 (deg/s²)</label><input type="number" id="inpProfAcc" value="10" step="1">
    </div>
    <div class="field" data-mode="pos vel">
      <label>轮廓减速度 (deg/s²)</label><input type="number" id="inpProfDec" value="10" step="1">
    </div>

    <div class="btn-row">
      <button id="btnSend" class="btn btn-primary">下发目标</button>
      <button id="btnStop" class="btn">停止运动</button>
    </div>

    <div id="cmdHint" class="hint"></div>
    </div>
  </section>

  <!-- ============ 曲线 ============ -->
  <section class="card card-chart">
    <div class="card-core">
    <h2 class="card-title">
      [ 波形 ]
      <span id="chartNote" class="chart-note">点「下发目标」后开始记录</span>
    </h2>
    <canvas id="chart"></canvas>
    </div>
  </section>

</main>

<!-- 消息条：连接/控制权/故障等一次性提示 -->
<div id="toast" class="toast" hidden></div>

<!-- GSAP 用本地副本，不走 CDN：试验台多为离线环境，CDN 挂了界面就废了。
     加载失败也不影响功能——anim.js 内部全程判空降级。 -->
<script src="lib/gsap.min.js"></script>
<script src="js/ws.js"></script>
<script src="js/chart.js"></script>
<script src="js/anim.js"></script>
<script src="js/app.js"></script>
</body>
</html>
